[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provenant"
version = "0.1.0"
description = "An AI Bill of Materials (AIBOM) generator for model & dataset provenance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krishita Sanjay Choksi" }]
keywords = [
    "AIBOM", "ML-BOM", "SBOM", "software supply chain",
    "model provenance", "license compliance", "CycloneDX", "SPDX",
]
dependencies = [
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
provenant = "provenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provenant = ["aibom/schemas/*.json", "data/fixtures/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
