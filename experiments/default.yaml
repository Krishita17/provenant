# Reproducible evaluation configuration.
# Reproduce with: make data && make eval && make figures && make test
name: default
seed: 7

projects:
  - examples/synthetic   # generated by `make data` (deterministic for this seed)
  - examples/real        # committed real-style projects + hand-labeled gold

gold_dir: references/gold

outputs:
  metrics: results/metrics.json
  per_project: results/per_project.csv
  figures: figures/

metrics:
  - discovery_recall
  - component_precision_recall
  - lineage_precision_recall_f1
  - finding_precision_recall_f1
  - provenance_accuracy
  - unknown_precision_recall      # provenance-gap honesty calibration
  - aibom_schema_validity
