# identifiers referenced by the bundled real-style example projects
# (examples/real/*). They let those projects resolve fully OFFLINE.
#
# IMPORTANT: The license strings below are an informational snapshot captured
# for demonstration and are NOT a legal determination. Licenses and terms change;
# re-confirm each component's license at its upstream source before relying on
# it. No model weights or datasets are included here — components are referenced
# by identifier and (illustrative) revision hash only.
#
# snapshot_captured_as_of: 2024-03-01
# ------------------------------------------------------------------------------
