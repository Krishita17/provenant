name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Generate synthetic data (offline)
        run: PYTHONPATH=src python -m provenant.cli gen-data --out examples --seed 7

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Evaluate against ground truth (offline)
        run: PYTHONPATH=src python -m provenant.cli eval --projects examples/synthetic,examples/real --out results

      - name: Assemble + validate AIBOMs for the worked example
        run: PYTHONPATH=src python -m provenant.cli bom examples/synthetic/finetune_stack --out results/ci

      - name: Regenerate figures (offline)
        run: PYTHONPATH=src python -m provenant.cli figures --results results --out /tmp/figures
